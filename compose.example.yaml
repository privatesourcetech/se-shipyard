# Example only -- copy to compose.yaml (gitignored) and adjust paths for your host.
services:
  se-shipyard:
    image: ghcr.io/privatesourcetech/se-shipyard:latest
    pull_policy: always
    container_name: se-shipyard
    restart: unless-stopped
    depends_on:
      - socket-proxy

    ports:
      - "8070:8080"

    environment:
      TZ: "UTC"
      # Docker is reached through the proxy below, not the raw socket.
      DOCKER_HOST: "tcp://socket-proxy:2375"
      # Login is created on first visit (stored in the data volume). Optional:
      # SETUP_TOKEN: ""   # if set, the first-run page also asks for this
      # Optional: Steam Web API key for Workshop search. Can also be set in the UI.
      # STEAM_API_KEY: ""

    volumes:
      - /path/to/apps/se-shipyard/data:/app/data

      # One pair of mounts per registered instance -- add both lines here,
      # redeploy, then register the instance in the UI. See README.
      - /path/to/apps/spaceengineers-<world>/server:/mnt/instances/<world>
      - /path/to/backups/spaceengineers-<world>:/mnt/backups/<world>

  # Narrow Docker socket proxy: Shipyard can read containers and start/stop/restart
  # them, but cannot create, exec into, kill or delete anything. Never publish a port.
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    pull_policy: always
    container_name: se-shipyard-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: shipyard_proxy_rules
        target: /usr/local/etc/haproxy/haproxy.cfg.template

# "$" is doubled ("$$") because compose interpolates inline content.
configs:
  shipyard_proxy_rules:
    content: |
      global
          log stdout format raw daemon "$${LOG_LEVEL}"

          pidfile /run/haproxy.pid
          maxconn 4000

          # Turn on stats unix socket
          server-state-file /var/lib/haproxy/server-state

      defaults
          mode http
          log global
          option httplog
          option dontlognull
          option http-server-close
          option redispatch
          retries 3
          timeout http-request 10s
          timeout queue 1m
          timeout connect 10s
          timeout client 10m
          timeout server 10m
          timeout http-keep-alive 10s
          timeout check 10s
          maxconn 3000

          # Allow seamless reloads
          load-server-state-from-file global

          # Use provided example error pages
          errorfile 400 /usr/local/etc/haproxy/errors/400.http
          errorfile 403 /usr/local/etc/haproxy/errors/403.http
          errorfile 408 /usr/local/etc/haproxy/errors/408.http
          errorfile 500 /usr/local/etc/haproxy/errors/500.http
          errorfile 502 /usr/local/etc/haproxy/errors/502.http
          errorfile 503 /usr/local/etc/haproxy/errors/503.http
          errorfile 504 /usr/local/etc/haproxy/errors/504.http

      backend dockerbackend
          server dockersocket $$SOCKET_PATH

      backend docker-events
          server dockersocket $$SOCKET_PATH
          timeout server 0

      frontend dockerfrontend
          bind $${BIND_CONFIG}

          # SE Shipyard allow-list. Anything not listed is denied (403). Notably NOT allowed:
          # create, exec, kill, delete, update, archive/file access, images, volumes, networks, info.
          #
          # Read: ping, version, list, inspect, logs, stats.
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/(_ping|version)$$ }
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$$ }
          http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs|stats)$$ }
          # Control: start, stop, restart a named container.
          http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)$$ }
          http-request deny
          default_backend dockerbackend
