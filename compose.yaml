services:
  se-shipyard:
    image: ghcr.io/privatesourcetech/se-shipyard:latest
    container_name: se-shipyard
    restart: unless-stopped

    ports:
      - "8070:8080"

    environment:
      TZ: "UTC"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/apps/se-shipyard/data:/app/data

      # One pair of mounts per registered instance -- add both lines here,
      # redeploy, then register the instance in the UI. See README.
      - /mnt/tank/apps/spaceengineers-plateau/server:/mnt/instances/plateau
      - /mnt/tank/backups/spaceengineers-plateau:/mnt/backups/plateau
